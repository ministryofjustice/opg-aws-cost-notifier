---
version: "3.6"
services:
  ministack:
    image: ministackorg/ministack:1.5.36@sha256:71b13e2045075b4faef3a0457db5ee33dce446fa1230ec6b75192b9c364b0f33
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
