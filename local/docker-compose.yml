---
version: "3.6"
services:
  ministack:
    image: ministackorg/ministack:1.5.39@sha256:30d91663112345e5ae32d4b142d84dc1c388d57bd82f2a07845e870ff97298c1
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
