---
version: "3.6"
services:
  ministack:
    image: ministackorg/ministack:1.5.42@sha256:f215f6e18f314a772301a7bb64819d26d2b736739cce99ccc7b53048ffbb4b1f
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
